<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>JustikaVirtualbooth - Arsip Foto</title>
    <meta name="description" content="Simpan dan cetak hasil foto seru kamu dari JustikaVirtualbooth!">
    <meta property="og:title" content="JustikaVirtualbooth - Arsip Foto">

    <!-- Font Tambahan -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Favicon -->
    <link rel="icon" href="assets/images/logo-justissika.png" type="image/png">
    
    <style>
        body {
            background-color: #ffffff; /* Ubah background jadi putih */
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Courier Prime', monospace; /* Font jurnalistik */
        }
        .viewer-container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 2vh;
        }
        .brand-header img {
            height: 55px;
            margin-bottom: 5px;
        }
        .brand-header h1 {
            font-size: 1.3rem;
            color: #000000;
            margin: 0;
            letter-spacing: 2px;
            font-weight: 800;
            font-family: 'Space Grotesk', sans-serif;
        }
        .photo-frame {
            background: #ffffff;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 1);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-frame img {
            width: 100%;
            border-radius: 8px;
            display: none; 
            border: 1px solid #000;
        }
        .btn-action {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 50px; /* Tumpul kapsul */
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 2px solid #000000;
            cursor: pointer;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
            text-transform: uppercase;
        }
        .btn-ig {
            background: #ffffff;
            color: #000000;
            margin-top: 10px;
            box-shadow: 2px 2px 0px rgba(0,0,0,1);
        }
        .btn-ig:hover {
            background: #000000;
            color: #ffffff;
            transform: translateY(-2px);
        }
        .btn-home {
            background: transparent;
            color: #000000;
        }
        .btn-home:hover {
            background: #000000;
            color: #ffffff;
        }
        .loading-state {
            color: #333333;
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            font-family: 'Space Grotesk', sans-serif;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #000000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="viewer-container">
        <div class="brand-header">
            <img src="assets/images/logo-justissika.png" alt="Justissika Logo" onerror="this.style.display='none'">
            <h1>JustikaVirtualbooth</h1>
        </div>

        <div class="photo-frame" id="photoFrame">
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <span>Mengambil arsip dari ruang redaksi...</span>
            </div>
            <img id="guestPhoto" src="" alt="Arsip JustikaVirtualbooth">
        </div>

        <p style="font-size: 0.85rem; color: #555; margin: 0;">
            📸 <b>Tekan dan tahan</b> gambar di atas untuk menyimpan (Save Image) ke perangkatmu.
        </p>

        <!-- 🛠️ GANTI LINK INSTAGRAM DI BAWAH INI JIKA PERLU 🛠️ -->
        <a href="https://www.instagram.com/lpm_justissica?stkn=ZjE0azVxcXJrd25v" target="_blank" class="btn-action btn-ig">
            Follow & Tag @justissika 📰
        </a>
        
        <a href="index.html" class="btn-action btn-home">
            Mulai Liputanmu Sendiri!
        </a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawData = urlParams.get('data'); 
            
            const guestPhoto = document.getElementById('guestPhoto');
            const loadingState = document.getElementById('loadingState');

            if (rawData) {
                try {
                    // PENGAMAN GANDA (TIDAK DIUBAH)
                    const safeEncodedData = rawData.replace(/ /g, '+');
                    const photoUrl = atob(safeEncodedData);
                    
                    guestPhoto.src = photoUrl;
                    guestPhoto.onload = () => {
                        loadingState.style.display = 'none';
                        guestPhoto.style.display = 'block';
                    };
                    guestPhoto.onerror = () => {
                        loadingState.innerHTML = "❌<br>Duh, arsip gagal dimuat.<br>Mungkin sudah dihapus dari server redaksi.";
                    };
                } catch (e) {
                    loadingState.innerHTML = "⚠️<br>Data QR tidak valid atau rusak.";
                }
            } else {
                loadingState.innerHTML = "⚠️<br>URL tidak valid. Arsip tidak ditemukan.";
            }
        });
    </script>
</body>
</html>
